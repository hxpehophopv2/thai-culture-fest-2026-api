services:
  postgres:
    image: postgres:16-alpine
    container_name: rooted-registration-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rooted_registration
    ports:
      - "55432:5432"
    volumes:
      - rooted_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rooted_registration"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rooted_postgres_data:
