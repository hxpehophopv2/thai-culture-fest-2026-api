services:
  postgres:
    image: postgres:16-alpine
    container_name: rooted-registration-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rooted_registration
    ports:
      - "55432:5432"
    volumes:
      - rooted_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rooted_registration"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rooted-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rooted.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - rooted_pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin-servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rooted_postgres_data:
  rooted_pgadmin_data:
