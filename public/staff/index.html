<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTED 2026 — Staff Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/staff/style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="login-logo">🌿</div>
      <h1>ROOTED 2026</h1>
      <p class="subtitle">Staff Scanner</p>
      <form id="login-form">
        <input type="text" id="booth-code" placeholder="ใส่รหัสฐาน เช่น MAL-7X2K" autocomplete="off" autofocus maxlength="8" style="text-transform:uppercase">
        <button type="submit" id="login-btn">เข้าสู่ระบบ</button>
      </form>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <!-- Scanner Screen -->
  <div id="scanner-screen" class="screen">
    <header class="scanner-header">
      <div>
        <h2 id="activity-name">ฐาน</h2>
        <span id="activity-zone" class="badge">LAB</span>
      </div>
      <button id="logout-btn" class="btn-outline">ออก</button>
    </header>

    <div id="scanner-area">
      <div id="qr-reader"></div>
      <p class="scan-hint">📷 วาง QR Code ในกรอบ</p>
    </div>

    <!-- Scan Result -->
    <div id="scan-result" class="result-card hidden">
      <div id="result-icon" class="result-icon"></div>
      <h3 id="result-title"></h3>
      <p id="result-name" class="result-name"></p>
      <p id="result-message" class="result-message"></p>

      <div id="result-actions" class="result-actions hidden">
        <button id="btn-override" class="btn-success" onclick="doOverride()">✅ อนุมัติ</button>
        <button id="btn-reject" class="btn-danger" onclick="doReject()">❌ ปฏิเสธ</button>
      </div>

      <button id="btn-next" class="btn-primary" onclick="nextScan()">แสกนคนถัดไป</button>

      <!-- Stamp Card -->
      <div id="stamp-card" class="stamp-card"></div>
    </div>

    <!-- Manual Search -->
    <div class="manual-search">
      <input type="text" id="search-input" placeholder="🔍 ค้นหาชื่อ (กรณี QR มีปัญหา)">
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/staff/app.js"></script>
</body>
</html>
